# NEPSE Alpha Lab - daily data refresh
#
# Rebuilds the 410-security universe snapshot (universe.json, verdicts.json,
# track-record.json, data/ltp/*.json, version.json), the market snapshot
# (wave1.json - index value, movers, RSI extremes, so the landing strip shows
# the session that just closed), collects the latest
# market headlines per symbol (news.json) and new verified corporate-action
# notices (corporate-actions.json), regenerates the 410 static symbol pages
# (stocks/), the corporate-action archive page (nepse-actions/) and the
# sitemap, every day after NEPSE close and pushes the result to main. The builder also refreshes the static top-10
# snapshot baked into nepse-screener/index.html (SEO), so that file is
# committed too. GitHub Pages redeploys automatically, and the analyzer picks
# up the new build version on next visit - no manual updates needed.
# Newly listed securities are discovered dynamically by the builder.

name: Refresh NEPSE Alpha Lab data

on:
  schedule:
    # 15:20 NPT (09:35 UTC), Monday-Friday - right after NEPSE close at 15:00 NPT.
    # The market snapshot (wave1.json) is rebuilt here from the last live
    # quote snapshot, so the landing strip shows the session that just closed.
    # The job commits only when data actually changed.
    - cron: '35 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild universe snapshot
        run: node tools/build-nepse-universe.js

      - name: Rebuild market snapshot (wave1)
        run: node tools/build-nepse-wave1.js

      - name: Collect market news
        run: node tools/build-nepse-news.js

      - name: Collect corporate actions
        run: node tools/collect-corporate-actions.js

      - name: Build symbol pages
        run: node tools/build-symbol-pages.js

      - name: Build actions archive page
        run: node tools/build-actions-page.js

      - name: Refresh sitemap
        run: node tools/build-sitemap.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nepse-chart/data nepse-screener/index.html stocks nepse-actions sitemap.xml
          git diff --cached --quiet || git commit -m "Alpha Lab: daily data refresh (automated)"
          git push
