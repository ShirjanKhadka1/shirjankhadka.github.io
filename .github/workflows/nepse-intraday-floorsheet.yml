name: NEPSE intraday floorsheet

# Polls the official NEPSE floorsheet endpoint during market hours and publishes
# nepse-brokers/data/intraday.json for the Broker Analytics "Latest" view.
# Near-real-time polling (5 min), not exchange-grade streaming.
#
# The two "Accumulate" steps below archive snapshots for the Technical
# Charts page's 15-minute timeframe. They read only the locally committed
# nepse-chart/data/live.json (published every 15 min by the live-quotes
# workflow) and dedupe by live.asof — they NEVER poll NEPSE themselves, so
# the archive cadence can never exceed 15 minutes. Do not add a faster
# intraday poll: NEPSE rate-limits aggressively and an IP ban would kill
# the site's live feed (owner decision, 2026-10-05).
#
# Failure alerts: email via SMTP (pinned SHA), never Facebook.
# Needs repo secrets MAIL_USERNAME, MAIL_PASSWORD, ALERT_EMAIL_TO.

on:
  schedule:
    # Mon-Fri, 06:00-09:30 UTC = 11:45-15:15 NPT (NEPSE trading window)
    - cron: '*/5 6-9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: skip every git commit/push/tag (safe proof mode). Also forced ON while the DRY_RUN repo variable is not false'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nepse-intraday-floorsheet
  cancel-in-progress: false

jobs:
  floorsheet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # Dry-run safety: true unless explicitly disabled (see DRY_RUN repo variable).
      DRY_RUN: ${{ inputs.dry_run == true || vars.DRY_RUN != 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Alerting pre-check
        run: |
          missing=""
          [ -n "${{ secrets.MAIL_USERNAME }}" ] || missing="$missing MAIL_USERNAME"
          [ -n "${{ secrets.MAIL_PASSWORD }}" ] || missing="$missing MAIL_PASSWORD"
          [ -n "${{ secrets.ALERT_EMAIL_TO }}" ] || missing="$missing ALERT_EMAIL_TO"
          if [ -n "$missing" ]; then
            echo "::warning::Failure emails are SILENT — missing repo secrets:$missing (Settings → Secrets → Actions)"
          else
            echo "alert email configured"
          fi

      - name: Fetch intraday floorsheet
        run: node tools/fetch-intraday-floorsheet.js
      - name: Accumulate intraday index observation
        run: node tools/build-intraday-index.js
      - name: Archive intraday stock quote snapshots (15m)
        # Reads only the local live.json; deduped by asof (see script header).
        run: node tools/build-intraday-quotes.js
      - name: Commit if changed
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "nepse-bot"
          git config user.email "nepse-bot@shirjankhadka.com.np"
          # intraday.json exists only when the NEPSE fetch succeeds — the
          # fetcher fail-safes to exit 0 without touching it. Guard the add
          # so a missing file can't fatal the step (exit 128) and fire a
          # false failure alert.
          git add nepse-chart/data/intraday-index.json
          # The quotes archive: staging the directory picks up the day's
          # file, the manifest, and deletions of pruned (>5 session) files.
          if [ -d nepse-chart/data/intraday ]; then
            git add nepse-chart/data/intraday/
          fi
          if [ -f nepse-brokers/data/intraday.json ]; then
            git add nepse-brokers/data/intraday.json
          fi
          git diff --cached --quiet && echo "intraday unchanged — nothing to commit" && exit 0
          git commit -m "intraday snapshots"
          # Several automations push to main; retry so a push that lands
          # between our pull and push doesn't fail the run.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "intraday snapshots pushed (attempt $i)"
              break
            fi
            echo "push attempt $i failed — retrying"
            sleep 5
          done
          git ls-remote origin main | grep -q "$(git rev-parse HEAD)" \
            || { echo "push did not land after 3 attempts" >&2; exit 1; }
      - name: Email alert — floorsheet poller failed
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] floorsheet: intraday poller failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The NEPSE intraday floorsheet poller FAILED
            (fetch error, commit/push conflict, or infrastructure).

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Job summary (on failure)
        if: failure()
        run: |
          {
            echo "## Intraday floorsheet: FAILED"
            echo ""
            echo "- The 5-minute poller failed (fetch error, commit/push conflict, or infrastructure)."
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
