name: NEPSE intraday floorsheet

# Polls the official NEPSE floorsheet endpoint during market hours and publishes
# nepse-brokers/data/intraday.json for the Broker Analytics "Latest" view.
# Near-real-time polling (5 min), not exchange-grade streaming.
#
# The two "Accumulate" steps below archive snapshots for the Technical
# Charts page's 15-minute timeframe. They read only the locally committed
# nepse-chart/data/live.json (published every 15 min by the live-quotes
# workflow) and dedupe by live.asof — they NEVER poll NEPSE themselves, so
# the archive cadence can never exceed 15 minutes. Do not add a faster
# intraday poll: NEPSE rate-limits aggressively and an IP ban would kill
# the site's live feed (owner decision, 2026-10-05).
#
# DEPLOY PATH (2026-11-04 migration, Charter v5 item 6): the old
# "Commit if changed" step pushed straight to protected main and has
# failed on every run since Oct-28 (branch protection rejects direct
# pushes; last success run 40686849488, Oct-28; e.g. Nov-3 run
# 41647597729: fetch/accumulate/archive all succeeded, only the
# commit step failed). This workflow now stages through the shared
# runner-side writer tools/content-data-writer.py (component
# intraday-floorsheet, GITHUB_TOKEN auth, blobs -> tree -> commit ->
# fast-forward ref update on the unprotected `data` branch,
# rebase-and-retry, never force, content-hash NO-CHANGES, manifest
# updated in the same commit) and dispatches Publish explicitly for
# the staged snapshot, then waits for its tag. GITHUB_TOKEN pushes
# do not re-trigger workflows, so the explicit dispatch is required;
# Publish itself purges the changed URLs (Cloudflare) and verifies
# served bytes, so no separate purge step is needed here (market-close
# migration precedent, PR #367).
#
# SEEDING (why this workflow seeds from the data branch): the
# accumulate/archive scripts MERGE into existing files (intraday-index
# appends observations, quotes appends snapshots and prunes to the last
# 5 sessions). Main's copies froze at Oct-28 under the dead push path,
# so building on main's copies would reset the accumulation on every
# run and lose the day's earlier observations. The seed step therefore
# restores the data branch's copies before the build steps — but only
# once this component is registered there; on the first migrated run
# (no intraday-floorsheet entry in data/_manifest.json yet) it keeps
# main's copies as the seed. A failed data fetch fails loud: silently
# falling back to main's stale copies would regress the archive.
#
# MANIFEST PATHS (rotating file set): the quotes archive is a rotating
# set (quotes-YYYY-MM-DD.json files, pruned to 5 sessions), so the
# staged file list changes from run to run. --manifest-paths records
# the union of (this run's staged files) + (previously registered
# non-quotes paths, so a fetch-fail run that stages no brokers file
# can never shrink the overlay set and drop live data). Previously
# registered quotes files that are no longer staged are DROPPED from
# the manifest: they are pruned days, and the quotes consumer reads
# only the days listed in the overlaid intraday/manifest.json, so the
# dropped files are inert even though their blobs remain on the data
# branch (the runner-side writer has no delete path; the assembler
# overlays only declared paths). No shared multi-writer output is
# claimed here: health.json and status/index.html are regenerated by
# Publish, jobs.json / data/manifest.json are owned by other lanes,
# and this workflow never stages them.
#
# NO-CHANGES (cadence-aware deviation from the market-close pattern):
# market-close dispatches Publish even on writer NO-CHANGES as a
# recovery path, but this workflow runs every 5 minutes — dispatching
# a full Pages deploy on every unchanged tick would flood the Publish
# queue. On NO-CHANGES this step therefore dispatches Publish only if
# the current data head has no data-* tag yet (i.e. a previous stage
# was never published); otherwise it exits quietly. A staged-but-
# unpublished snapshot is also recovered by the next WRITTEN run,
# which publishes the whole data head including it.
#
# Failure alerts: email via SMTP (pinned SHA), never Facebook.
# Needs repo secrets MAIL_USERNAME, MAIL_PASSWORD, ALERT_EMAIL_TO.

on:
  schedule:
    # Mon-Fri, 06:00-09:30 UTC = 11:45-15:15 NPT (NEPSE trading window)
    - cron: '*/5 6-9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: skip every git commit/push/tag (safe proof mode). Also forced ON while the DRY_RUN repo variable is not false'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nepse-intraday-floorsheet
  cancel-in-progress: false

jobs:
  floorsheet:
    runs-on: ubuntu-latest
    # 30 min: the fetch/build/writer steps plus the Publish wait below
    # (up to 20 min; observed Publish runs take ~2-4 min). The old
    # 15-min timeout cannot hold a Publish wait.
    timeout-minutes: 30
    permissions:
      contents: write
      # actions:write dispatches the Publish workflow for the staged
      # snapshot. Without it, `gh workflow run` 403s (watchdog fix
      # precedent, PR #369: a workflow that dispatches another
      # workflow needs actions:write).
      actions: write
    env:
      # Dry-run safety: true unless explicitly disabled (see DRY_RUN repo variable).
      DRY_RUN: ${{ inputs.dry_run == true || vars.DRY_RUN != 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the seed step reads the data branch and the
          # Publish-wait step checks tags (market-close precedent).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Alerting pre-check
        run: |
          missing=""
          [ -n "${{ secrets.MAIL_USERNAME }}" ] || missing="$missing MAIL_USERNAME"
          [ -n "${{ secrets.MAIL_PASSWORD }}" ] || missing="$missing MAIL_PASSWORD"
          [ -n "${{ secrets.ALERT_EMAIL_TO }}" ] || missing="$missing ALERT_EMAIL_TO"
          if [ -n "$missing" ]; then
            echo "::warning::Failure emails are SILENT — missing repo secrets:$missing (Settings → Secrets → Actions)"
          else
            echo "alert email configured"
          fi

      - name: Seed intraday outputs from data branch
        run: |
          # Fail loud on a data fetch failure: falling back to main's
          # frozen Oct-28 copies would regress the accumulation.
          git fetch origin data || { echo "::error::data branch fetch failed — refusing to build on stale main copies" >&2; exit 1; }
          MANIFEST="$(git show origin/data:data/_manifest.json 2>/dev/null)" \
            || { echo "::error::data branch has no data/_manifest.json — refusing to seed on a guess" >&2; exit 1; }
          REGISTERED="$(node -e "
            const m = JSON.parse(process.argv[1]);
            console.log(Object.prototype.hasOwnProperty.call(m, 'intraday-floorsheet') ? 'yes' : 'no');
          " "$MANIFEST")"
          if [ "$REGISTERED" != "yes" ]; then
            echo "intraday-floorsheet not registered on the data branch yet — keeping main's copies as the seed (first migrated run)"
            exit 0
          fi
          echo "seeding intraday outputs from the data branch"
          # Index + brokers: restore where the data branch has them;
          # a missing file is fine (the fetcher/accumulator recreates it).
          git checkout origin/data -- nepse-chart/data/intraday-index.json 2>/dev/null || true
          git checkout origin/data -- nepse-brokers/data/intraday.json 2>/dev/null || true
          # Quotes directory: remove first, then restore whole — a plain
          # checkout would leave main's pruned files behind and the
          # stage step would resurrect them.
          rm -rf nepse-chart/data/intraday
          git checkout origin/data -- nepse-chart/data/intraday 2>/dev/null || true
          echo "seeded:"
          ls nepse-chart/data/intraday-index.json nepse-brokers/data/intraday.json 2>/dev/null || true
          ls nepse-chart/data/intraday/ 2>/dev/null || true

      - name: Fetch intraday floorsheet
        run: node tools/fetch-intraday-floorsheet.js
      - name: Accumulate intraday index observation
        run: node tools/build-intraday-index.js
      - name: Archive intraday stock quote snapshots (15m)
        # Reads only the local live.json; deduped by asof (see script header).
        run: node tools/build-intraday-quotes.js
      - name: Stage to data branch + Publish (data-branch path)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --- Build the staged file list: only existing, non-empty files.
          # The fetcher fail-safes to exit 0 without touching
          # nepse-brokers/data/intraday.json, so a missing brokers file
          # must never reach the writer (it refuses missing inputs).
          STAGED=()
          [ -s nepse-chart/data/intraday-index.json ] && STAGED+=("nepse-chart/data/intraday-index.json")
          if [ -d nepse-chart/data/intraday ]; then
            [ -s nepse-chart/data/intraday/manifest.json ] && STAGED+=("nepse-chart/data/intraday/manifest.json")
            for f in nepse-chart/data/intraday/quotes-*.json; do
              [ -s "$f" ] && STAGED+=("$f")
            done
          fi
          [ -s nepse-brokers/data/intraday.json ] && STAGED+=("nepse-brokers/data/intraday.json")
          if [ "${#STAGED[@]}" -eq 0 ]; then
            echo "intraday unchanged — nothing to stage, no Publish dispatched"
            echo "## Intraday floorsheet: no change — nothing staged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "staged files:"
          printf '  %s\n' "${STAGED[@]}"
          # --- Manifest paths: staged files + previously registered
          # non-quotes paths (never shrink the overlay set on a
          # fetch-fail run); pruned quotes files drop out.
          PREV="$(node -e "
            const m = JSON.parse(process.argv[1]);
            const e = m['intraday-floorsheet'];
            console.log(e && Array.isArray(e.paths) ? e.paths.join('\n') : '');
          " "$(git show origin/data:data/_manifest.json 2>/dev/null || echo '{}')")"
          MANIFEST_PATHS="$(node -e "
            const staged = process.argv[1].split('\n').filter(Boolean);
            const prev = process.argv[2].split('\n').filter(Boolean);
            const stagedSet = new Set(staged);
            const keep = prev.filter(p => !/^nepse-chart\/data\/intraday\/quotes-.*\.json$/.test(p) || stagedSet.has(p));
            const all = [...new Set([...staged, ...keep])].sort();
            console.log(all.join(','));
          " "$(printf '%s\n' "${STAGED[@]}")" "$PREV")"
          echo "manifest paths: $MANIFEST_PATHS"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run: would stage ${#STAGED[@]} file(s) to the data branch (component intraday-floorsheet) + dispatch Publish — SKIPPED (nothing reaches the data branch)"
            echo "## Intraday floorsheet: DRY-RUN — stage + Publish skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --- Stage via the shared runner-side writer (never main,
          # never force). Its updated_via string still says
          # content-data-writer — cosmetic, shared-tool provenance.
          FILE_ARGS=()
          for f in "${STAGED[@]}"; do FILE_ARGS+=(--file "$f:$f"); done
          python3 tools/content-data-writer.py \
            --component intraday-floorsheet \
            --asof "$(TZ=Asia/Kathmandu date +%F)" \
            --message "intraday floorsheet: $(TZ=Asia/Kathmandu date +%F) (data-branch)" \
            --manifest-paths "$MANIFEST_PATHS" \
            "${FILE_ARGS[@]}" > writer.log 2>&1 || { cat writer.log; exit 1; }
          cat writer.log
          PROOF="$(tail -n 1 writer.log)"
          echo "writer proof: $PROOF"
          # WRITTEN proofs carry no status field (only commit/tree/files);
          # NO-CHANGES proofs carry status but no commit.
          STATUS="$(node -e "console.log(JSON.parse(process.argv[1]).status || 'WRITTEN')" "$PROOF")"
          SNAP="$(node -e "console.log(JSON.parse(process.argv[1]).commit || '')" "$PROOF")"
          # Wait helper: a snapshot is published only when Publish tags it
          # (the tag job runs after Pages deploy + production-byte
          # verification, and Publish purges the changed URLs itself).
          wait_for_tag() {
            local sha="$1"
            for i in $(seq 1 20); do
              if git ls-remote origin 'refs/tags/data-*' | grep -q "$sha"; then
                return 0
              fi
              sleep 60
            done
            return 1
          }
          if [ "$STATUS" = "WRITTEN" ]; then
            [ -n "$SNAP" ] || { echo "::error::writer WRITTEN but proof has no commit SHA" >&2; exit 1; }
            echo "snapshot=$SNAP"
          else
            # NO-CHANGES: no new commit — the data head already carries
            # these files. Dispatch Publish only if that head was never
            # tagged (a previous stage that never published); otherwise
            # a 5-minute cadence would flood the Publish queue with
            # identical deploys.
            SNAP="$(gh api repos/${{ github.repository }}/git/refs/heads/data --jq .object.sha)"
            echo "writer NO-CHANGES — data head $SNAP"
            if git ls-remote origin 'refs/tags/data-*' | grep -q "$SNAP"; then
              echo "data head already published — no Publish dispatched"
              echo "## Intraday floorsheet: no change — data head $SNAP already published" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "data head unpublished — dispatching Publish for recovery"
          fi
          # GITHUB_TOKEN pushes do not re-trigger workflows, so dispatch
          # Publish explicitly for this snapshot.
          gh workflow run publish.yml --ref main -f snapshot_sha="$SNAP"
          if ! wait_for_tag "$SNAP"; then
            echo "::error::Publish did not tag snapshot $SNAP within 20 minutes — data is staged but not verified live" >&2
            exit 1
          fi
          TAG="$(git ls-remote origin 'refs/tags/data-*' | awk -v s="$SNAP" '$1 == s {print $2}' | head -n 1)"
          echo "## Intraday floorsheet: deployed data snapshot \`$SNAP\` (tag \`${TAG##refs/tags/}\`)" >> "$GITHUB_STEP_SUMMARY"
      - name: Email alert — floorsheet poller failed
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] floorsheet: intraday poller failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The NEPSE intraday floorsheet poller FAILED
            (fetch error, stage/Publish failure, or infrastructure).

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Job summary (on failure)
        if: failure()
        run: |
          {
            echo "## Intraday floorsheet: FAILED"
            echo ""
            echo "- The 5-minute poller failed (fetch error, stage/Publish failure, or infrastructure)."
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
