# NEPSE news refresh — real-time news feed (V5, data-branch path).
#
# Every 30 minutes: rebuilds news.json from RSS feeds (Arthasansar, BizMandu,
# OnlineKhabar, MeroLagani) and stages it to the `data` branch if the
# ITEMS changed. The Publish (P2) workflow deploys main + data on every
# data push. No commit to protected main, no PR per data run (GH006 fix:
# the old path pushed to main and died on branch protection).
#
# Two migration details that matter:
#   * The builder MERGES fresh RSS items into the existing rolling file,
#     so the workflow seeds nepse-chart/data/news.json from the DATA
#     branch before building — main's copy is stale by design now and
#     must never be used as the merge base again.
#   * No-change detection is by ITEMS, not bytes: the builder stamps a
#     fresh generated_at on every run, so a byte comparison would
#     "change" every 30 minutes. When items are unchanged and the
#     component is already registered, the writer prints NO-CHANGES
#     and writes nothing — healthy ticks stay silent (no Publish,
#     no mail). First registration always writes, so the assembler
#     picks the file up.
#
# Owner directive 2026-10-04: news must be automated real-time, not manual —
# "lots of news are happening and time really matters."
#
# Alert: email via SMTP on failure (dawidd6/action-send-mail pinned to SHA),
# subject "[NEPSE ALERT] news-refresh: ...". NEVER Facebook.

name: NEPSE news refresh (real-time)

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Seed current news.json from data branch
        # The builder merges into the existing rolling file: the merge
        # base MUST be the data branch's copy (main's copy is stale
        # since the migration). A 404 means no data copy yet — proceed
        # from main's copy (the pre-migration baseline). Any other
        # failure aborts: building on a stale base would drop items.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, sys, urllib.error, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["GITHUB_TOKEN"]
          url = (f"https://api.github.com/repos/{repo}/contents/"
                 f"nepse-chart/data/news.json?ref=data")
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {tok}",
              "User-Agent": "nepse-news-refresh"})
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read())
              open("nepse-chart/data/news.json", "wb").write(
                  base64.b64decode(data["content"]))
              print("seeded news.json from data branch")
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print("no data-branch news.json yet; "
                        "builder starts from main copy")
              else:
                  print(f"seed failed: HTTP {e.code}", file=sys.stderr)
                  sys.exit(1)
          PYEOF

      - name: Rebuild news.json
        run: node tools/build-nepse-news.js

      - name: Validate news.json
        id: validate
        run: |
          node -e "
            const n = require('./nepse-chart/data/news.json');
            const items = n.items || n;
            if (!Array.isArray(items) || items.length === 0) {
              console.error('news.json has no items');
              process.exit(1);
            }
            // Every item must have title, link, source — no junk.
            for (const it of items.slice(0, 50)) {
              if (!it.title || !it.link || !it.src) {
                console.error('bad item: ' + JSON.stringify(it).slice(0, 100));
                process.exit(1);
              }
            }
            console.log('news.json OK: ' + items.length + ' items');
          "
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Stage to data branch if items changed
        if: steps.validate.outputs.valid == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/news-data-writer.py \
            --file nepse-chart/data/news.json \
            --asof "$(TZ=Asia/Kathmandu date +%F)" \
            --message "news: refresh $(date -u +%Y-%m-%dT%H:%M) ($(node -e "console.log(require('./nepse-chart/data/news.json').items.length)") items)"

      - name: Email alert — news refresh failed
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] news-refresh: build or validation failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: Nepse Decode news refresh
          body: |
            The NEPSE news refresh workflow FAILED. No news was deployed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
