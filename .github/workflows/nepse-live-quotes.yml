# NEPSE Alpha Lab — live quote snapshots (near-real-time)
#
# Polls NEPSE's official API server-side every 15 minutes during trading hours
# (Mon–Fri, 10:45–15:00 NPT = 05:00–09:15 UTC; pre-open 10:45, regular session
# 11:00–15:00) and stages a compact
# nepse-chart/data/live.json snapshot that the static site polls each minute.
# STAGING MODEL (batched publisher, 2026-10-29): this workflow NEVER writes
# to main — branch protection blocks direct pushes, and per-tick PRs cannot
# keep up with the ~20-minute required gate. Each tick commits the fresh
# snapshot to the unprotected `intraday-staging` branch instead (fast-forward
# only, never force-push); the batched publisher (tools/publish-intraday-batch.py,
# every 30 min during market hours) takes the latest staged state through ONE
# PR per window under the full gate, and merges it when green. The fetcher is
# fail-safe: market closed, auth/token change, rate limit or any error ->
# exit 0 WITHOUT touching live.json, so the site keeps serving the last good
# snapshot and falls back to the community feed. Commits only when live.json
# actually changed vs staging.
#
# Failure alerts: email via SMTP (pinned SHA), never Facebook.
# Needs repo secrets MAIL_USERNAME, MAIL_PASSWORD, ALERT_EMAIL_TO.
#
# Failure alerts: email via SMTP (pinned SHA), never Facebook.
# Needs repo secrets MAIL_USERNAME, MAIL_PASSWORD, ALERT_EMAIL_TO.

name: Refresh NEPSE live quotes

on:
  schedule:
    # 05:00–09:25 UTC = 10:45–15:10 NPT, Mon–Fri. Last two runs (15:05/15:10 NPT)
    # capture the finalized closing snapshot after the 15:00 bell.
    - cron: '0,15,30,45 5-8 * * 1-5'
    - cron: '0,15,20,25 9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: skip every git commit/push/tag (safe proof mode). Also forced ON while the DRY_RUN repo variable is not false'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nepse-live-quotes
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # Dry-run safety: true unless explicitly disabled (see DRY_RUN repo variable).
      DRY_RUN: ${{ inputs.dry_run == true || vars.DRY_RUN != 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the staging dance below bases intraday-staging on
          # the remote staging tip and must push a complete branch.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Alerting pre-check
        run: |
          missing=""
          [ -n "${{ secrets.MAIL_USERNAME }}" ] || missing="$missing MAIL_USERNAME"
          [ -n "${{ secrets.MAIL_PASSWORD }}" ] || missing="$missing MAIL_PASSWORD"
          [ -n "${{ secrets.ALERT_EMAIL_TO }}" ] || missing="$missing ALERT_EMAIL_TO"
          if [ -n "$missing" ]; then
            echo "::warning::Failure emails are SILENT — missing repo secrets:$missing (Settings → Secrets → Actions)"
          else
            echo "alert email configured"
          fi

      - name: Fetch official live quotes
        run: node tools/fetch-nepse-live.js

      - name: Stage live snapshot if changed
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f nepse-chart/data/live.json ]; then
            echo "live.json absent (market closed or fetch skipped) — nothing to stage"
            exit 0
          fi
          # Save the fresh snapshot, then base staging on the remote staging
          # tip so the push stays fast-forward (the publisher only READS
          # staging, so this branch never races; no force-push, ever).
          cp nepse-chart/data/live.json /tmp/live-fresh.json
          git fetch origin intraday-staging 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/intraday-staging; then
            git checkout -B intraday-staging origin/intraday-staging
          else
            git checkout -B intraday-staging origin/main
          fi
          cp /tmp/live-fresh.json nepse-chart/data/live.json
          git add nepse-chart/data/live.json
          if git diff --cached --quiet; then
            echo "live.json unchanged vs staging — nothing to stage"
            exit 0
          fi
          git commit -m "Alpha Lab: live quote snapshot (staging, automated)"
          if git push origin intraday-staging; then
            echo "staged to intraday-staging"
          else
            echo "staging push failed, re-syncing once and retrying..."
            git fetch origin intraday-staging
            git reset --hard origin/intraday-staging
            cp /tmp/live-fresh.json nepse-chart/data/live.json
            git add nepse-chart/data/live.json
            if git diff --cached --quiet; then
              echo "unchanged after re-sync — nothing to stage"
              exit 0
            fi
            git commit -m "Alpha Lab: live quote snapshot (staging, automated)"
            git push origin intraday-staging
          fi

      - name: Email alert — live quotes failed
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] live-quotes: refresh failed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The NEPSE live-quotes refresh FAILED
            (fetch error, commit/push conflict, or infrastructure).
            The site keeps serving the last good snapshot.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Job summary (on failure)
        if: failure()
        run: |
          {
            echo "## Live quotes: FAILED"
            echo ""
            echo "- The live-quotes refresh failed (fetch error, commit/push conflict, or infrastructure)."
            echo "- The site keeps serving the last good snapshot."
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
