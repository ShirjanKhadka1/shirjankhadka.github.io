# NEPSE market-close pipeline (Phase 1)
#
# Mon-Fri at 15:20 NPT (09:35 UTC), retries 16:10 (10:25 UTC) and 17:00 (11:15 UTC).
# NEPSE trades Mon-Fri, 11:00-15:00 NPT.
#
# workflow_dispatch input dry_run (default false): when true, the full pipeline
# executes but EVERY git commit/push/tag is skipped — safe proof mode, nothing
# can reach main. Emails still send, so dry runs prove the alert paths too.
#
# Flow: trading-day check -> idempotency check -> fetch/build ->
#   source-session check ->
#     new session at source: manifest (canonical: data/manifest.json) -> VALIDATE ->
#       pass: atomic single commit to main + data tag -> push
#       fail: AUTO-ROLLBACK to last good data-* tag -> email alert -> job fails
#     NO new session at source (after the FINAL retry only): treat as market
#       closed (unlisted holiday suspected) -> low-priority [NEPSE NOTICE]
#       email, job recorded as skipped, NO failure alert, no deploy
#     NO new session at source (earlier retries): quiet end — the next retry
#       handles it, so slow NEPSE publishing never raises a false alarm
#
# Validation/job results are committed even on failure so /status/ reflects reality.
# Manual rollback: dispatch with rollback_to_tag=data-YYYY-MM-DD-N (format validated).
#
# Alerts: email via SMTP (dawidd6/action-send-mail pinned to commit SHA),
# subject "[NEPSE ALERT] market-close: ...", plus an Actions job summary.
# NEVER Facebook for failures. Needs repo secrets MAIL_USERNAME, MAIL_PASSWORD
# (Gmail app password), ALERT_EMAIL_TO.

name: NEPSE market-close pipeline

on:
  schedule:
    - cron: '35 9 * * 1-5'   # 15:20 NPT Mon-Fri
    - cron: '25 10 * * 1-5'  # 16:10 NPT retry
    - cron: '15 11 * * 1-5'  # 17:00 NPT retry
  # TEMPORARY (pre-merge proof only — remove before merge): GitHub cannot
  workflow_dispatch:
    inputs:
      session:
        description: 'Override session date (YYYY-MM-DD)'
        required: false
      rollback_to_tag:
        description: 'Rollback data files to tag (data-YYYY-MM-DD-N)'
        required: false
      dry_run:
        description: 'Dry run: skip every git commit/push/tag (safe proof mode). Also forced ON while the DRY_RUN repo variable is not false'
        type: boolean
        default: false
      override_count_gate:
        description: 'OVERRIDE the security-count-stable gate (use only for legitimate listing changes). Requires override_count_reason.'
        type: boolean
        default: false
      override_count_reason:
        description: 'Reason for overriding security-count-stable (required if override_count_gate is true). Logged and emailed.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: nepse-market-close
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    # 60 min: the build (~15-20 min) plus the Publish wait below (up to
    # 30 min) must fit inside one job run.
    timeout-minutes: 60
    permissions:
      contents: write
      # actions:write dispatches the Publish workflow for the staged
      # snapshot (workflow_dispatch IS triggered by GITHUB_TOKEN;
      # plain pushes by it are not — which is why Publish is
      # dispatched explicitly instead of relying on the push trigger).
      actions: write
    env:
      # Dry-run safety: true unless explicitly disabled. The DRY_RUN repo
      # variable defaults to 'true'; flipping it to 'false' (and not passing
      # dry_run=true on dispatch) enables real commits/pushes/tags.
      DRY_RUN: ${{ inputs.dry_run == true || vars.DRY_RUN != 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Alerting pre-check
        run: |
          missing=""
          [ -n "${{ secrets.MAIL_USERNAME }}" ] || missing="$missing MAIL_USERNAME"
          [ -n "${{ secrets.MAIL_PASSWORD }}" ] || missing="$missing MAIL_PASSWORD"
          [ -n "${{ secrets.ALERT_EMAIL_TO }}" ] || missing="$missing ALERT_EMAIL_TO"
          if [ -n "$missing" ]; then
            echo "::warning::Failure emails are SILENT — missing repo secrets:$missing (Settings → Secrets → Actions)"
          else
            echo "alert email configured"
          fi

      - name: Trading-day check
        id: trading
        run: |
          node -e "
            const td = require('./tools/trading-days');
            const now = new Date();
            const today = td.todayNPT(now);
            const trading = td.isTradingDay(today);
            console.log('today=' + today + ' trading_day=' + trading + ' expected_session=' + td.expectedSessionDate(now));
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'trading=' + trading + '\n');
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'session=' + (process.env.SESSION_OVERRIDE || td.expectedSessionDate(now)) + '\n');
          "
        env:
          SESSION_OVERRIDE: ${{ inputs.session }}

      - name: Manual rollback to tag
        # KNOWN REMAINING 422 SURFACE (deliberate, 2026-11-04 migration):
        # manual rollback restores files across ALL data components, so
        # no single writer component can carry it, and its guards read
        # main tags/manifest which no longer advance under the
        # data-branch regime. It needs a data-snapshot rollback
        # redesign, not a push swap. Manual-dispatch only: on
        # invocation it fails loud at the push (fail-safe) instead of
        # silently doing nothing.
        if: inputs.rollback_to_tag != '' && env.DRY_RUN != 'true'
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_to_tag }}
          ROLLBACK_SESSION: ${{ steps.trading.outputs.session }}
        run: |
          if ! [[ "$ROLLBACK_TAG" =~ ^data-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$ ]]; then
            echo "::error::Invalid rollback_to_tag format: must match ^data-YYYY-MM-DD-N$" >&2
            exit 1
          fi
          # P3-1 guards: rollback-once-per-session + newer-than-tag.
          # Either refusal fails loud (no rollback, no commit) — never silent.
          if ! node tools/check-rollback-once.js "$ROLLBACK_SESSION"; then
            node tools/record-job.js market-close failed "rollback to $ROLLBACK_TAG refused: rollback-once guard (session $ROLLBACK_SESSION already rolled back once)" --session="$ROLLBACK_SESSION"
            exit 1
          fi
          ROLLBACK_TAG_SESSION=$(echo "$ROLLBACK_TAG" | sed -E 's/^data-([0-9]{4}-[0-9]{2}-[0-9]{2})-[0-9]+$/\1/')
          MAIN_SESSION=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/manifest.json", "utf8")).session_date || "")')
          if [ -n "$MAIN_SESSION" ] && [ "$MAIN_SESSION" \> "$ROLLBACK_TAG_SESSION" ] && git tag --list "data-$MAIN_SESSION-*" | grep -q .; then
            echo "::error::Newer-than-tag guard: main holds tagged session $MAIN_SESSION newer than rollback target $ROLLBACK_TAG ($ROLLBACK_TAG_SESSION) — refusing rollback." >&2
            node tools/record-job.js market-close failed "rollback to $ROLLBACK_TAG refused by newer-than-tag guard (main holds tagged $MAIN_SESSION)" --session="$ROLLBACK_SESSION"
            exit 1
          fi
          node tools/rollback-data.js "$ROLLBACK_TAG" "$ROLLBACK_SESSION"
          node tools/record-job.js market-close success "manual rollback to $ROLLBACK_TAG" --session="$ROLLBACK_SESSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nepse-chart/data data
          git diff --cached --quiet || git commit -m "market-close: manual rollback data to $ROLLBACK_TAG"
          git pull --rebase --autostash origin main
          git push origin main
          echo "## Market-close: manual rollback to \`$ROLLBACK_TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Idempotency check (skip if this session already published)
        id: idem
        if: inputs.rollback_to_tag == ''
        run: |
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const session = process.env.SESSION;
            // The close no longer commits jobs.json to main (content
            // lane owns it), so the old local-jobs check can never see
            // a previous run's record. Skip only when the LIVE publish
            // manifest already carries this session under the
            // market-close component: staged-but-unpublished data must
            // NOT skip, or a failed Publish would never be retried.
            let done = false;
            try {
              const raw = execSync('curl -sS -A \"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36\" --max-time 30 https://shirjankhadka.com.np/data/publish-manifest.json', { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              const m = JSON.parse(raw);
              const a = m.components && m.components['market-close'] && m.components['market-close'].asof;
              done = (a === session);
              console.log('live publish-manifest market-close asof=' + a + ' session=' + session);
            } catch (e) {
              console.log('::warning::Live publish-manifest unreadable — falling back to local jobs.json check');
              try {
                const jobs = JSON.parse(fs.readFileSync('nepse-chart/data/jobs.json', 'utf8'));
                const j = jobs['market-close'];
                const td = require('./tools/trading-days');
                const today = td.todayNPT(new Date());
                done = !!(j && j.status === 'success' && j.session_date === session && String(j.ran_at_npt).startsWith(today));
              } catch (e2) {}
            }
            console.log('already_done=' + done);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'done=' + done + '\n');
          "
        env:
          SESSION: ${{ steps.trading.outputs.session }}

      - name: Skip — not a trading day
        if: steps.trading.outputs.trading != 'true' && inputs.rollback_to_tag == ''
        run: |
          node tools/record-job.js market-close skipped "not a trading day (weekend/holiday)" --session="${{ steps.trading.outputs.session }}"
          # No push: jobs.json is owned by the content lane (data
          # branch), and a push to main 422s under branch protection —
          # which used to turn every holiday into a false job failure.
          # The skip is visible in this run's log + summary; the
          # midnight rollover carries the holiday note to the live
          # manifest.
          echo "market-close: skipped (non-trading day) — record local only, no deploy"
          echo "## Market-close: skipped (non-trading day)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch + build market data
        if: steps.trading.outputs.trading == 'true' && steps.idem.outputs.done != 'true' && inputs.rollback_to_tag == ''
        run: |
          node tools/build-nepse-universe.js
          python3 tools/build_trending_value.py
          node tools/build-nepse-wave1.js
          node tools/build-nepse-news.js
          node tools/collect-corporate-actions.js
          node tools/build-symbol-pages.js
          node tools/build-actions-page.js
          node tools/update-index-history.js
          node tools/build-daily-ohlc.js
          node tools/build-sitemap.js
          node tools/prerender-freshness.js

      - name: Stamp session_date on close payloads (Charter v5)
        # Every staged payload must carry session_date, derived from
        # the payload's OWN date (never imposed top-down, never
        # overwriting a present value — a present-but-wrong stamp is
        # a builder bug for validation/gates to catch, not to paper
        # over). Runs before manifest + validation so the validated
        # bytes are exactly the staged bytes. js/nepse-daily.js is the
        # documented exception: it is generated JS, and its session
        # is already carried by its header date range + last row.
        if: steps.trading.outputs.trading == 'true' && steps.idem.outputs.done != 'true' && inputs.rollback_to_tag == ''
        run: |
          node -e "
            const fs = require('fs');
            const stamp = (file, ownDate) => {
              const obj = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (obj.session_date) { console.log(file + ': session_date already ' + obj.session_date); return; }
              if (!ownDate || !/^\d{4}-\d{2}-\d{2}$/.test(ownDate)) {
                console.error(file + ': cannot derive session_date (no own date) — refusing to stage a session-less payload');
                process.exit(1);
              }
              obj.session_date = ownDate;
              fs.writeFileSync(file, JSON.stringify(obj, null, 1) + '\n');
              console.log(file + ': stamped session_date=' + ownDate);
            };
            const wave1 = JSON.parse(fs.readFileSync('nepse-chart/data/wave1.json', 'utf8'));
            stamp('nepse-chart/data/wave1.json', String(wave1.asof || '').slice(0, 10));
            const spark = JSON.parse(fs.readFileSync('nepse-chart/data/index-spark.json', 'utf8'));
            stamp('nepse-chart/data/index-spark.json', spark.to);
            const arch = JSON.parse(fs.readFileSync('data/index-history.json', 'utf8'));
            stamp('data/index-history.json', arch.to);
          "

      - name: Source session check (new session at source?)
        id: srcsess
        if: steps.trading.outputs.trading == 'true' && steps.idem.outputs.done != 'true' && inputs.rollback_to_tag == ''
        run: node tools/check-source-session.js --session="${{ steps.trading.outputs.session }}"

      - name: Write manifest (canonical data/manifest.json)
        if: steps.trading.outputs.trading == 'true' && steps.idem.outputs.done != 'true' && inputs.rollback_to_tag == '' && steps.srcsess.outputs.new_session == 'true'
        run: node tools/build-manifest.js
        env:
          BUILD_COMMIT: ${{ github.sha }}

      - name: Validate build (hard gates)
        id: validate
        if: steps.trading.outputs.trading == 'true' && steps.idem.outputs.done != 'true' && inputs.rollback_to_tag == '' && steps.srcsess.outputs.new_session == 'true'
        run: |
          OVERRIDE_ARGS=""
          if [ "${{ inputs.override_count_gate }}" = "true" ]; then
            if [ -z "${{ inputs.override_count_reason }}" ]; then
              echo "::error::override_count_gate=true requires override_count_reason"
              exit 2
            fi
            OVERRIDE_ARGS="--override-count-gate --override-count-reason=${{ inputs.override_count_reason }}"
            echo "override_used=true" >> "$GITHUB_OUTPUT"
          fi
          if node tools/validate-build.js --session="${{ steps.trading.outputs.session }}" $OVERRIDE_ARGS; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check security-count expansion flag
        id: expansion
        if: steps.validate.outputs.valid == 'true'
        run: |
          if grep -q 'EXPANSION beyond +5%' nepse-chart/data/validation.json; then
            echo "flagged=true" >> "$GITHUB_OUTPUT"
            echo "## Market-close: security-count EXPANSION flagged" >> "$GITHUB_STEP_SUMMARY"
            echo "Quoted count expanded beyond +5% vs the last good tag. Deploy continues (P3-1 direction-split gate); review the new listings / resumed halts behind the growth." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "flagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email alert — security-count expansion flagged
        if: steps.expansion.outputs.flagged == 'true' && (success() || failure())
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE NOTICE] market-close: security-count EXPANSION flagged for ${{ steps.trading.outputs.session }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The security-count-stable validation gate flagged an EXPANSION
            beyond +5% vs the last good tag. The deploy CONTINUED (P3-1
            direction-split gate: expansion with all substantive gates
            passing is FLAG + deploy + notice, not FAIL).

            Session: ${{ steps.trading.outputs.session }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review the new listings / resumed halts behind the growth.

      - name: Final retry — no new session, treat as market closed
        id: notice
        if: steps.trading.outputs.trading == 'true' && steps.idem.outputs.done != 'true' && inputs.rollback_to_tag == '' && steps.srcsess.outputs.new_session == 'false' && (github.event.schedule == '15 11 * * 1-5' || github.event_name == 'workflow_dispatch')
        run: |
          SESSION="${{ steps.trading.outputs.session }}"
          DATA_SESSION="${{ steps.srcsess.outputs.data_session }}"
          node tools/record-job.js market-close skipped "no new session at source after final retry — treated as market closed (unlisted holiday suspected); data session $DATA_SESSION" --session="$SESSION"
          node tools/build-manifest.js
          # No push: jobs.json is owned by the content lane and the
          # manifest describes the whole main checkout (content-lane
          # precedent: never stage it). A push to main 422s under
          # branch protection — which used to turn a benign
          # market-closed day into a job failure + false alert. The
          # skip record and manifest stay local; the midnight
          # rollover carries the holiday note to the live manifest.
          # The LOW-PRIORITY notice email below still sends.
          echo "market-close: no new session — record + manifest local only, no deploy"
          {
            echo "## Market-close: no new session at source (treated as market closed)"
            echo ""
            echo "- Expected session: \`$SESSION\`"
            echo "- Data session: \`$DATA_SESSION\`"
            echo "- This is a LOW-PRIORITY notice, not a failure alert."
            echo "- If the market was genuinely open today, add the date to tools/nepse-holidays.json and check the source fetchers."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SESSION_OVERRIDE: ${{ steps.srcsess.outputs.data_session }}
          BUILD_COMMIT: ${{ github.sha }}

      - name: Email notice — no new session (market closed)
        if: steps.notice.outcome == 'success'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE NOTICE] market-close: no new session for ${{ steps.trading.outputs.session }} — treated as market closed"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            LOW-PRIORITY NOTICE (not a failure):

            After the final retry, the NEPSE source published no new session for
            ${{ steps.trading.outputs.session }} (data is at ${{ steps.srcsess.outputs.data_session }}).
            The day was treated as MARKET CLOSED — likely an unlisted public holiday
            missing from tools/nepse-holidays.json.

            Nothing was deployed and no failure alert was raised. If the market was
            genuinely open today, add the date to tools/nepse-holidays.json and
            check the source fetchers.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Status page: https://shirjankhadka.com.np/status/

      - name: Auto-rollback to last good tag
        id: rollback
        if: steps.validate.outputs.valid == 'false'
        run: |
          TAG=$(git tag --list 'data-*' --sort=-creatordate | head -n1)
          if [ -z "$TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "::warning::Validation failed and no data-* tag exists — nothing to roll back to. Manual intervention required."
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            # P3-1 guards: rollback-once-per-session + newer-than-tag.
            # Either refusal fails loud (no rollback, no commit) — never silent.
            if ! node tools/check-rollback-once.js "${{ steps.trading.outputs.session }}"; then
              node tools/record-job.js market-close failed "rollback to $TAG refused: rollback-once guard (session ${{ steps.trading.outputs.session }} already rolled back once)" --session="${{ steps.trading.outputs.session }}"
              exit 1
            fi
            TAG_SESSION=$(echo "$TAG" | sed -E 's/^data-([0-9]{4}-[0-9]{2}-[0-9]{2})-[0-9]+$/\1/')
            MAIN_SESSION=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/manifest.json", "utf8")).session_date || "")')
            if [ -n "$MAIN_SESSION" ] && [ "$MAIN_SESSION" \> "$TAG_SESSION" ] && git tag --list "data-$MAIN_SESSION-*" | grep -q .; then
              echo "::error::Newer-than-tag guard: main holds tagged session $MAIN_SESSION newer than rollback target $TAG ($TAG_SESSION) — refusing rollback." >&2
              node tools/record-job.js market-close failed "rollback to $TAG refused by newer-than-tag guard (main holds tagged $MAIN_SESSION)" --session="${{ steps.trading.outputs.session }}"
              exit 1
            fi
            node tools/rollback-data.js "$TAG" "${{ steps.trading.outputs.session }}"
          node tools/record-job.js market-close failed "validation failed for session ${{ steps.trading.outputs.session }} — auto-rolled back to $TAG" --session="${{ steps.trading.outputs.session }}"
          # No push: validation gates staging, so an invalid build is
          # never staged — the live data is untouched and there is
          # nothing to roll back on the data branch. The local restore
          # above keeps the working tree clean; the failure record
          # stays local (jobs.json/validation.json are owned by the
          # content lane). The old push to main 422s under branch
          # protection.
          echo "market-close: invalid build discarded, nothing staged — no data-branch rollback needed"
          fi

      - name: Email alert — security-count-stable overridden
        if: steps.validate.outputs.override_used == 'true' && (success() || failure())
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE NOTICE] market-close: security-count-stable gate OVERRIDDEN for ${{ steps.trading.outputs.session }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The security-count-stable validation gate was MANUALLY OVERRIDDEN.

            Session: ${{ steps.trading.outputs.session }}
            Reason: ${{ inputs.override_count_reason }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This bypass is logged in the workflow run. If this was not
            intentional, investigate immediately.

      - name: Email alert — validation failed, auto-rolled back
        if: steps.validate.outputs.valid == 'false' && (success() || failure())
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] market-close: validation failed for ${{ steps.trading.outputs.session }}, auto-rolled back to ${{ steps.rollback.outputs.tag || 'NO TAG AVAILABLE \u2014 manual intervention required' }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The NEPSE market-close pipeline validation FAILED for session ${{ steps.trading.outputs.session }}.
            The deploy was blocked and data was automatically rolled back to ${{ steps.rollback.outputs.tag }} (last known good).

            Failed gates are in the job summary below. The invalid build was never deployed.\n\nRollback target: ${{ steps.rollback.outputs.tag || 'NONE — no data-* tag exists; manual intervention required' }}.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Status page: https://shirjankhadka.com.np/status/

      - name: Fail the job (validation)
        if: steps.validate.outputs.valid == 'false'
        run: |
          {
            echo "## Market-close: VALIDATION FAILED (deploy blocked)"
            echo ""
            echo "- Session: \`${{ steps.trading.outputs.session }}\`"
            echo "- Auto-rollback to: \`${{ steps.rollback.outputs.tag }}\`"
            echo "- Failed gates:"
            node -e "
              const v = require('./nepse-chart/data/validation.json');
              for (const g of v.gates.filter(g => !g.pass)) console.log('  - ' + g.gate + ': ' + g.detail);
            "
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Build health.json (pipeline diagnostics)
        if: steps.validate.outputs.valid == 'true'
        run: node tools/build-health.js

      - name: Stage close to data branch + Publish (data-branch path)
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SESSION="${{ steps.trading.outputs.session }}"
          node tools/record-job.js market-close success "session $SESSION deployed" --session="$SESSION"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run: would stage 4 close files to the data branch (component market-close) + dispatch Publish — SKIPPED (nothing reaches the data branch)"
            echo "## Market-close: DRY-RUN — stage + Publish skipped (would have deployed session \`$SESSION\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Exactly the close pipeline's own outputs — never news.json
          # (news-refresh owns it), never corporate-actions / jobs /
          # validation (content lane owns them), never live.json
          # (capture lane owns it), never universe / verdicts /
          # trending / value (universe + signals lanes own them),
          # never daily-ohlc (ohlc lane owns it), never pages or
          # sitemap (page lanes own them; fresh data reaches pages
          # through their JSON fetches), never data/manifest.json
          # (it describes the whole main checkout — content-lane
          # precedent: staging it would mis-describe other
          # components' data-branch files), never data/health.json
          # or status/index.html (Publish regenerates both; the
          # assembler forbids staging them).
          # tools/content-data-writer.py is reused with --component
          # market-close: it is the proven runner-side writer
          # (GITHUB_TOKEN auth, blobs -> tree -> commit ->
          # fast-forward ref update, rebase-and-retry, never force,
          # content-hash NO-CHANGES, manifest updated in the same
          # commit). Its updated_via string still says
          # content-data-writer — cosmetic, shared-tool provenance.
          python3 tools/content-data-writer.py \
            --component market-close \
            --asof "$SESSION" \
            --message "market-close: session $SESSION (validated)" \
            --manifest-paths "nepse-chart/data/wave1.json,nepse-chart/data/index-spark.json,data/index-history.json,js/nepse-daily.js" \
            --file nepse-chart/data/wave1.json:nepse-chart/data/wave1.json \
            --file nepse-chart/data/index-spark.json:nepse-chart/data/index-spark.json \
            --file data/index-history.json:data/index-history.json \
            --file js/nepse-daily.js:js/nepse-daily.js > writer.log 2>&1 || { cat writer.log; exit 1; }
          cat writer.log
          PROOF="$(tail -n 1 writer.log)"
          echo "writer proof: $PROOF"
          SNAP="$(node -e "
            const p = JSON.parse(process.argv[1]);
            console.log(p.commit || '');
          " "$PROOF")"
          if [ -z "$SNAP" ]; then
            # NO-CHANGES: no new commit — publish the current data
            # head (it already carries this session's files). This
            # is also the recovery path when a previous run staged
            # but its Publish failed: re-dispatch, don't re-stage.
            SNAP="$(gh api repos/${{ github.repository }}/git/refs/heads/data --jq .object.sha)"
            echo "writer NO-CHANGES — publishing data head $SNAP"
          fi
          echo "snapshot=$SNAP"
          # GITHUB_TOKEN pushes do not re-trigger workflows, so
          # dispatch Publish explicitly for this snapshot
          # (workflow_dispatch IS triggered by GITHUB_TOKEN) and
          # wait for its tag job: the tag is created only after
          # Pages deploy + production-byte verification. Publish
          # itself purges the changed URLs (Cloudflare) and verifies
          # served bytes, so no separate purge step is needed here.
          gh workflow run publish.yml --ref main -f snapshot_sha="$SNAP"
          PUBLISHED=""
          for i in $(seq 1 30); do
            if git ls-remote origin 'refs/tags/data-*' | grep -q "$SNAP"; then
              PUBLISHED="yes"
              break
            fi
            sleep 60
          done
          if [ "$PUBLISHED" != "yes" ]; then
            echo "::error::Publish did not tag snapshot $SNAP within 30 minutes — data is staged but not verified live" >&2
            exit 1
          fi
          TAG="$(git ls-remote origin 'refs/tags/data-*' | awk -v s="$SNAP" '$1 == s {print $2}' | head -n 1)"
          echo "## Market-close: deployed session \`$SESSION\` (data snapshot \`$SNAP\`, tag \`${TAG##refs/tags/}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Email alert — job failed
        if: failure() && steps.validate.outputs.valid != 'false'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] market-close: job failed (not a validation failure)"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The NEPSE market-close pipeline job FAILED outside validation
            (fetch/build error, push conflict, or infrastructure).

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Status page: https://shirjankhadka.com.np/status/

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Market-close pipeline"
            echo ""
            echo "- Session: \`${{ steps.trading.outputs.session }}\`"
            echo "- Trading day: \`${{ steps.trading.outputs.trading }}\`"
            echo "- Already done (idempotency): \`${{ steps.idem.outputs.done }}\`"
            echo "- New session at source: \`${{ steps.srcsess.outputs.new_session }}\` (data session \`${{ steps.srcsess.outputs.data_session }}\`)"
            echo "- Validation: \`${{ steps.validate.outputs.valid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
