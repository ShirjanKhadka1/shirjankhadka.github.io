# CI — quality gates (Phase 1, honest mode)
#
# Playwright smoke tests + axe ratchet + internal link check + visual
# regression + Lighthouse + gitleaks, all on GitHub runners.
# Runs on every push to main, on PRs, and nightly.
#
# HONEST MODE: no `|| true` anywhere — tool failures fail the run.
# Lighthouse budgets stay warn-level for the baseline (numbers land in
# artifacts); every other gate is hard.
# Artifacts: smoke report, axe results, link-check log, visual diffs,
# lighthouse reports (3 runs/page, median).
#
# SPEED (gate-rules 2026-10-30, no check dropped, job name unchanged):
# npm cache + Playwright browser cache + 3-lane Lighthouse. Expected
# quality ~15 min -> ~8-9 min; measured on this PR's own check runs.

name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 1 * * *'  # nightly baseline
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual baselines on this branch (review the diff — never blind-update)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks full-history scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          # Caches ~/.npm: npm ci (~1-2 min) -> seconds on hit, and warms
          # the npx cache so the lighthouse@12 download below is cached too.
          cache: 'npm'
          cache-dependency-path: 'tests/package-lock.json'

      - name: Install test deps
        working-directory: tests
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          # Pinned to the Playwright version in tests/package.json; bump
          # this key whenever that version changes, or stale browsers linger.
          key: playwright-1.63.0-${{ runner.os }}-chromium

      - name: Install Playwright Chromium
        working-directory: tests
        run: npx playwright install chromium --with-deps

      - name: Serve site
        run: |
          (python3 -m http.server 8080 >/tmp/http.log 2>&1 &)
          sleep 2
          curl -sf -o /dev/null http://localhost:8080/

      - name: Internal link check (zero broken links)
        run: node tests/link-check.js

      - name: Playwright smoke tests
        working-directory: tests
        run: npx playwright test smoke.spec.ts
        env:
          BASE_URL: http://localhost:8080

      - name: Axe ratchet (fail on new/worsened violations)
        working-directory: tests
        run: node axe-scan.js
        env:
          BASE_URL: http://localhost:8080

      - name: Lighthouse (mobile, 3 runs per URL)
        run: |
          mkdir -p lhci-out
          run_page() {
            page="$1"
            slug=$(echo "$page" | tr '/' '_' | sed 's/_$//'); [ -z "$slug" ] && slug=home
            for i in 1 2 3; do
              ok=false
              for attempt in 1 2; do
                if npx --yes lighthouse@12 "http://localhost:8080/$page" \
                  --output=json \
                  --output-path="lhci-out/${slug}-run${i}" \
                  --chrome-flags="--headless --no-sandbox" \
                  --quiet; then ok=true; break; fi
                echo "lighthouse $slug run $i attempt $attempt failed — retrying once"
                sleep 5
              done
              if [ "$ok" != "true" ]; then echo "::error::lighthouse failed twice for $page"; exit 1; fi
            done
          }
          # 3 lanes: 8 pages x 3 runs each, same per-page runs, same retry
          # loop, same output filenames (the summary step below reads them
          # exactly as before). Budgets are warn-level in this job, so CPU
          # inflation from parallel runs cannot fail the run; the retry
          # loop covers crash flakes. Sequential Lighthouse wall ~10 min
          # -> ~3.5 min at 3 lanes.
          for page in "" "nepse-decode/" "nepse-chart/" "nepse-screener/" "nepse-trending/" "nepse-value/" "nepse-brokers/" "blog/"; do
            run_page "$page" &
            while [ "$(jobs -r | wc -l)" -ge 3 ]; do wait -n; done
          done
          wait

      - name: Summarize Lighthouse medians (budgets WARN-level)
        run: |
          node -e "
            const fs = require('fs');
            const pages = {};
            for (const f of fs.readdirSync('lhci-out').filter(f => f.endsWith('.json'))) {
              const m = f.match(/^(.*)-run([123])\.report\.json$/); if (!m) continue;
              (pages[m[1]] = pages[m[1]] || []).push(JSON.parse(fs.readFileSync('lhci-out/' + f, 'utf8')));
            }
            const med = (a) => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)];
            const out = {};
            for (const [slug, runs] of Object.entries(pages)) {
              const cat = (r, c) => r.categories[c].score;
              const aud = (r, id) => r.audits[id] ? r.audits[id].numericValue : null;
              out[slug] = {
                performance: +med(runs.map(r => cat(r, 'performance'))).toFixed(2),
                accessibility: +med(runs.map(r => cat(r, 'accessibility'))).toFixed(2),
                best_practices: +med(runs.map(r => cat(r, 'best-practices'))).toFixed(2),
                seo: +med(runs.map(r => cat(r, 'seo'))).toFixed(2),
                LCP_ms: Math.round(med(runs.map(r => aud(r, 'largest-contentful-paint')))),
                TBT_ms: Math.round(med(runs.map(r => aud(r, 'total-blocking-time')))),
                CLS: +med(runs.map(r => aud(r, 'cumulative-layout-shift'))).toFixed(3),
              };
            }
            fs.writeFileSync('lhci-out/baseline-summary.json', JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out, null, 2));
            // warn-level budgets (Phase 1): report, do not fail
            // P2.3: added TBT, JS weight, font weight budgets per brief
            const warns = [];
            for (const [slug, s] of Object.entries(out)) {
              if (s.performance < 0.9) warns.push(slug + ': performance ' + s.performance + ' < 0.90');
              if (s.LCP_ms > 2000) warns.push(slug + ': LCP ' + s.LCP_ms + 'ms > 2000ms');
              if (s.CLS > 0.05) warns.push(slug + ': CLS ' + s.CLS + ' > 0.05');
              if (s.TBT_ms > 200) warns.push(slug + ': TBT ' + s.TBT_ms + 'ms > 200ms');
              if (s.accessibility < 0.95) warns.push(slug + ': accessibility ' + s.accessibility + ' < 0.95');
              // JS and font weight: sum transferSize by resource type from network requests
              const reqs = runs[0].audits['network-requests'] ? runs[0].audits['network-requests'].details.items : [];
              let jsBytes = 0, fontBytes = 0;
              for (const r of reqs) {
                const url = r.url || '';
                const sz = r.transferSize || 0;
                if (url.endsWith('.js')) jsBytes += sz;
                if (url.endsWith('.woff2') || url.endsWith('.woff')) fontBytes += sz;
              }
              // gz estimate: ~30% of transfer for JS (already compressed), fonts are binary
              if (jsBytes > 170 * 1024) warns.push(slug + ': JS ' + Math.round(jsBytes/1024) + 'KB > 170KB');
              if (fontBytes > 60 * 1024) warns.push(slug + ': fonts ' + Math.round(fontBytes/1024) + 'KB > 60KB');
            }
            if (warns.length) {
              console.log('::warning::Lighthouse budgets (warn-level):');
              warns.forEach(w => console.log('::warning::  ' + w));
            } else console.log('all Lighthouse budgets met');
          "

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-${{ github.run_number }}
          path: |
            tests/smoke-report.json
            tests/axe-results.json
            lhci-out/
            tests/test-results/
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI quality gates"
            echo ""
            echo "- Link check, smoke tests, axe ratchet: see job steps (hard gates)"
            echo "- Visual regression: separate job (Playwright container), 2 passes for variance check"
            echo "- Lighthouse budgets are warn-level in Phase 1 — medians in \`lhci-out/baseline-summary.json\`"
            echo "- Gitleaks: full-history secret scan"
          } >> "$GITHUB_STEP_SUMMARY"

  visual:
    name: Visual regression (Playwright container)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      # Official Playwright image — baselines MUST be generated in this
      # same image, or font/rendering differences cause false diffs.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install test deps
        working-directory: tests
        run: npm ci

      - name: Serve site
        run: |
          (python3 -m http.server 8080 >/tmp/http.log 2>&1 &)
          sleep 2
          curl -sf -o /dev/null http://localhost:8080/

      - name: Visual regression — pass 1 (8 pages, desktop + mobile)
        working-directory: tests
        run: |
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            npx playwright test visual.spec.ts --update-snapshots
          else
            npx playwright test visual.spec.ts
          fi
        env:
          BASE_URL: http://localhost:8080

      - name: Visual regression — pass 2 (run-to-run variance check)
        if: inputs.update_snapshots != true
        working-directory: tests
        run: npx playwright test visual.spec.ts
        env:
          BASE_URL: http://localhost:8080

      - name: Upload regenerated baselines (manual dispatch)
        if: inputs.update_snapshots == true && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines-${{ github.run_number }}
          path: tests/visual.spec.ts-snapshots/
          retention-days: 30

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diffs-${{ github.run_number }}
          path: tests/test-results/
          retention-days: 30
