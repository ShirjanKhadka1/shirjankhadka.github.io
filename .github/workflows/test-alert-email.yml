name: Test pipeline email alert (temporary)

# One-off proof that the pipeline alert email path works end-to-end with the
# Gmail app password secrets. DELETED after the test — not part of Phase 1.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send test alert email
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] test: pipeline email check"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            TEST ONLY — please ignore the [NEPSE ALERT] prefix.

            This is a one-off check that the NEPSE pipeline alert emails work:
            Gmail SMTP (smtp.gmail.com:587) from GitHub Actions using the
            MAIL_USERNAME / MAIL_PASSWORD / ALERT_EMAIL_TO repo secrets.

            If you received this, the alert path is live. The temporary
            workflow file is deleted right after this test.
