# ROUND 2 / R6 — Lighthouse budgets + Playwright smoke (5 core pages).
#
# Budgets (tools/round2-budgets-r6.json, the standard Web Vitals
# "good" thresholds): LCP <= 2500 ms, CLS <= 0.1, INP <= 200 ms.
# Lighthouse runs against a LOCALHOST static server rooted at the
# checked-out repo with the desktop preset (these are wide-table
# dashboards; the preset is stated, not hidden), one report per page.
# tools/round2-verify-r6.py --lighthouse-dir asserts LCP/CLS and INP
# when Lighthouse reports a numeric INP. Lab Lighthouse often reports
# NO numeric INP (it needs real interaction); that case is reported
# as INP=unmeasured-in-lab and must never be read as an INP pass.
# A Playwright smoke step (tools/round2-smoke-r6.js) loads all 5 pages
# in both themes and asserts HTTP 200 + rendered body text.
#
# Runs on every push to main touching the 5 pages, their stylesheets,
# or the R6 tooling. HONEST MODE: no `|| true` anywhere — a budget
# breach or a failed smoke load fails the run.
#
# ENFORCEMENT NOTE (R7, still blocked): this workflow RUNS on push,
# but it is not yet a REQUIRED status check — required checks need the
# PR flow (fine-grained token with contents + PR write, plus branch
# protection), which needs the site owner's GitHub action and is
# tracked as an R7 blocker. Until R7 lands, deploys stay twin-verified
# direct-to-main and this check is a post-push tripwire, not a gate.
# Do not claim it blocks merges until branch protection lists it.
#
# PREVIEW NOTE (R7, still blocked): there is NO Cloudflare Pages
# project and NO PR flow, so there is no preview deployment to test
# against. This workflow deliberately runs against LOCALHOST builds
# only. It does NOT run against the live custom domain as a substitute
# preview — live verification stays the deploy-time authenticated ref
# read + curl byte check, not CI. Do not reframe this as a preview
# check until R7 delivers a real Pages preview per PR.

name: R6 Lighthouse budgets + smoke

on:
  push:
    branches: [main]
    paths:
      - 'nepse-decode/index.html'
      - 'nepse-screener/index.html'
      - 'nepse-screener/screener.css'
      - 'nepse-sectors/index.html'
      - 'nepse-sectors/sectors.css'
      - 'nepse-brokers/index.html'
      - 'nepse-daily/index.html'
      - 'css/nd-tokens.css'
      - 'css/nd-editorial-theme.css'
      - 'css/nd-chrome.css'
      - 'css/nd-home.css'
      - 'css/nd-cinema.css'
      - 'css/nd-daily.css'
      - 'css/sig-pro.css'
      - 'tools/round2-smoke-r6.js'
      - 'tools/round2-verify-r6.py'
      - 'tools/round2-budgets-r6.json'
      - '.github/workflows/round2-r6-perf.yml'
  # pull_request runs UNFILTERED by design: these are required checks,
  # and a path-filtered check that never runs blocks the PR (GitHub
  # reports it as Expected forever). Push stays path-filtered.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r6-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-and-smoke:
    name: Lighthouse budgets + Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps (pyyaml for the verifier)
        run: python3 -m pip install pyyaml
      - name: Install Lighthouse + Playwright (scratch, never committed)
        run: |
          mkdir -p "$RUNNER_TEMP/r6tools"
          cd "$RUNNER_TEMP/r6tools"
          npm init -y >/dev/null 2>&1
          npm install lighthouse playwright
          npx playwright install chromium
      - name: Serve repo on localhost
        run: |
          nohup python3 -m http.server 8901 >/tmp/r6-server.log 2>&1 &
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:8901/nepse-decode/
      - name: Playwright smoke (5 pages x 2 themes)
        run: NODE_PATH="$RUNNER_TEMP/r6tools/node_modules" node tools/round2-smoke-r6.js http://127.0.0.1:8901
      - name: Lighthouse (desktop preset, performance only)
        run: |
          mkdir -p lh
          for p in decode screener sectors brokers daily; do
            case "$p" in
              decode) u="http://127.0.0.1:8901/nepse-decode/";;
              screener) u="http://127.0.0.1:8901/nepse-screener/";;
              sectors) u="http://127.0.0.1:8901/nepse-sectors/";;
              brokers) u="http://127.0.0.1:8901/nepse-brokers/";;
              daily) u="http://127.0.0.1:8901/nepse-daily/";;
            esac
            "$RUNNER_TEMP/r6tools/node_modules/.bin/lighthouse" "$u" \
              --output=json --output-path="lh/$p.report.json" \
              --only-categories=performance --preset=desktop \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          done
          ls -la lh/
      - name: Assert Lighthouse budgets
        run: python3 tools/round2-verify-r6.py --lighthouse-dir lh
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-r6-reports
          path: lh/
