name: IPO SEBON Watch

# Daily check of SEBON's public prospectus listings for new IPO approvals.
# New entries are added to data/ipo.json as "upcoming" with SEBON as source.
# Existing entries are never modified by this workflow.
#
# Deploy path: branch protection on main requires a PR (2026-10-29) —
# a bare `git push` to main dies there (run 43181624199, 2026-11-12:
# first real diff since protection landed; the Nov 3–11 runs were all
# no-ops). So changes land via a stable branch + PR with auto-merge:
# GitHub merges once the required checks are green. The branch is
# reset daily (force-with-lease on this unprotected scratch branch
# only), so a re-run reuses the open PR instead of opening duplicates.

on:
  schedule:
    # 01:15 UTC = 07:00 NPT daily
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Check SEBON for new prospectuses
        run: node tools/ipo-sebon-watch.js

      - name: Advance IPO lifecycle phases from announcements
        # upcoming -> local-open -> foreign-open -> open from issue-manager
        # notices, plus date-driven close transitions. Never invents dates.
        run: node tools/ipo-lifecycle.js

      - name: Update IPO statuses (Open/Closed by date)
        run: node tools/ipo-status-update.js

      - name: Commit new entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nepse-decode-bot"
          git config user.email "info@shirjankhadka.com.np"
          git add data/ipo.json
          if git diff --cached --quiet; then
            echo "No new IPO entries."
            exit 0
          fi
          # Land via PR: direct push to main is blocked by branch
          # protection. Stable scratch branch, reset each run so a
          # re-run updates the open PR instead of opening a duplicate.
          BRANCH="ipo-watch/daily"
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git commit -m "IPO watch: SEBON prospectus + lifecycle + status update $(date -u +%F)"
          git push --force-with-lease origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty' 2>/dev/null || true)" ]; then
            echo "PR already exists for $BRANCH, reusing it"
          else
            gh pr create --title "IPO watch: SEBON prospectus + lifecycle + status update $(date -u +%F)" \
              --body "Automated daily IPO watch: new SEBON prospectuses, lifecycle phase advances and date-driven status updates in data/ipo.json. All values come from SEBON listings or dated notices; no dates invented. Merges automatically once the required checks are green." \
              --base main --head "$BRANCH"
          fi
          # Auto-merge: GitHub merges once the required checks are
          # green (retry briefly — mergeability is computed async
          # right after PR creation). If this fails the run fails
          # loud so the watch fires; the PR stays open for the next run.
          for i in 1 2 3 4 5 6; do
            if gh pr merge --squash --auto "$BRANCH"; then
              echo "auto-merge enabled for $BRANCH"
              break
            fi
            echo "auto-merge attempt $i failed, retrying in 20s..."
            sleep 20
            if [ "$i" = 6 ]; then
              echo "::error::could not enable auto-merge for $BRANCH after 6 attempts"
              exit 1
            fi
          done
