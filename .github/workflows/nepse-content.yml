# NEPSE content pipeline (Phase 1, data-branch path)
#
# Daily at 06:00 and 18:00 NPT (00:15 / 12:15 UTC), every day.
# Refreshes: announcements, corporate actions, actions archive
# page, sitemap. Also runs the staleness sentinel: if the market data is more
# than one trading day behind the expected session, emails an alert.
#
# Publish path (GH006 fix, mirrors PR #249's news migration): this workflow
# NEVER pushes to protected main. Validated outputs go to the `data` branch
# via tools/content-data-writer.py (blobs -> tree -> commit -> fast-forward
# ref update, rebase-and-retry, never force-push), and the Publish (P2)
# workflow assembles main + data into the deployed site. No commit to main,
# no PR per data run.
#
# OWNERSHIP (hard rule): news-refresh OWNS nepse-chart/data/news.json. This
# workflow does NOT build news.json (build-nepse-news.js was removed from
# the refresh step) and the writer REFUSES that path — a content run that
# rewrites news.json is a failure of this migration, not a success.
#
# Seeding: builders that MERGE into an existing file build on the DATA
# branch's copy, never main's stale copy — announcements.json (90-day
# archive merge), corporate-actions.json (storyKey dedup store), jobs.json
# (record-job preserves other jobs). sitemap.xml is the exception: its
# preserved-entry set lives on main (blog posts land via PRs), so the
# workflow keeps main's copy as the sitemap seed. data/manifest.json is
# still built for the validation gates but is NOT staged: it describes
# the whole main checkout, and staging it would mis-describe other
# components' data-branch files (notably news.json).
#
# Alerts: email via SMTP (dawidd6/action-send-mail pinned to commit SHA),
# subject "[NEPSE ALERT] content: ...", plus an Actions job summary.
# NEVER Facebook for failures. Needs repo secrets MAIL_USERNAME, MAIL_PASSWORD
# (Gmail app password), ALERT_EMAIL_TO.
#
# workflow_dispatch input dry_run (default false): when true, the full pipeline
# executes but EVERY data-branch write is skipped — safe proof mode, nothing
# can reach the data branch. Emails still send, so dry runs prove the alert paths too.

name: NEPSE content pipeline

on:
  schedule:
    - cron: '15 0 * * *'   # 06:00 NPT daily
    - cron: '15 12 * * *'  # 18:00 NPT daily
  # TEMPORARY (pre-merge proof only — remove before merge): GitHub cannot
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: skip every data-branch write (safe proof mode). Also forced ON while the DRY_RUN repo variable is not false'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nepse-content
  cancel-in-progress: false

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Dry-run safety: true unless explicitly disabled. The DRY_RUN repo
      # variable defaults to 'true'; flipping it to 'false' (and not passing
      # dry_run=true on dispatch) enables real commits/pushes.
      DRY_RUN: ${{ inputs.dry_run == true || vars.DRY_RUN != 'false' }}
    steps:
      # Full history: tools/validate-build.js walks live.json's git history for
      # the intraday count gate (same-session snapshot baseline) when a
      # scheduled run drifts into market hours.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Alerting pre-check
        run: |
          missing=""
          [ -n "${{ secrets.MAIL_USERNAME }}" ] || missing="$missing MAIL_USERNAME"
          [ -n "${{ secrets.MAIL_PASSWORD }}" ] || missing="$missing MAIL_PASSWORD"
          [ -n "${{ secrets.ALERT_EMAIL_TO }}" ] || missing="$missing ALERT_EMAIL_TO"
          if [ -n "$missing" ]; then
            echo "::warning::Failure emails are SILENT — missing repo secrets:$missing (Settings → Secrets → Actions)"
          else
            echo "alert email configured"
          fi

      - name: Seed merge-base files from data branch
        # Announcements / corporate-actions / jobs MERGE into their
        # existing files: the merge base MUST be the data branch's
        # copy (main's copy is stale since the migration). A 404
        # means no data copy yet — proceed from main's copy. Any
        # other failure aborts: building on a stale base would drop
        # items. sitemap.xml is deliberately NOT seeded: its
        # preserved entries live on main (blog posts land via PRs).
        # news.json is deliberately NOT seeded, built, or staged:
        # news-refresh owns it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, sys, urllib.error, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["GITHUB_TOKEN"]
          for path in ("nepse-chart/data/announcements.json",
                       "nepse-chart/data/corporate-actions.json",
                       "nepse-chart/data/jobs.json"):
              url = (f"https://api.github.com/repos/{repo}/contents/"
                     f"{path}?ref=data")
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {tok}",
                  "User-Agent": "nepse-content-pipeline"})
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read())
                  open(path, "wb").write(base64.b64decode(data["content"]))
                  print(f"seeded {path} from data branch")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print(f"no data-branch {path} yet; "
                            "builder starts from main copy")
                  else:
                      print(f"seed failed for {path}: HTTP {e.code}",
                            file=sys.stderr)
                      sys.exit(1)
          PYEOF

      - name: Refresh announcements + corporate actions
        run: |
          node tools/build-announcements.js
          node tools/collect-corporate-actions.js
          node tools/build-actions-page.js
          node tools/build-sitemap.js

      - name: Staleness sentinel
        id: stale
        run: |
          node -e "
            const fs = require('fs');
            const td = require('./tools/trading-days');
            const m = JSON.parse(fs.readFileSync('data/manifest.json', 'utf8'));
            const expected = td.expectedSessionDate(new Date());
            // count trading days between manifest session and expected
            let d = m.session_date, behind = 0;
            while (d < expected && behind < 10) { d = td.nextTradingDay(d); if (d <= expected) behind++; }
            console.log('manifest_session=' + m.session_date + ' expected=' + expected + ' behind=' + behind);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'behind=' + behind + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'session=' + m.session_date + '\n');
          "

      - name: Email alert — stale market data
        if: steps.stale.outputs.behind > 1
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] content: market data stale (session ${{ steps.stale.outputs.session }}, ${{ steps.stale.outputs.behind }} sessions behind)"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The market data is STALE: manifest session is ${{ steps.stale.outputs.session }},
            ${{ steps.stale.outputs.behind }} trading days behind the expected session.
            The market-close pipeline may have failed — check /status/.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Status page: https://shirjankhadka.com.np/status/

      - name: Write manifest + validate
        id: validate
        run: |
          node tools/build-manifest.js
          if node tools/validate-build.js; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          BUILD_COMMIT: ${{ github.sha }}

      - name: Validation FAILED — record, alert, block deploy
        if: steps.validate.outputs.valid == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/record-job.js content failed "validation gates failed — deploy blocked"
          if [ "$DRY_RUN" != "true" ]; then
            # Stage ONLY the failure record to the data branch: the
            # built data is NOT deployed when validation fails (old
            # behavior committed only jobs+validation to main).
            # --manifest-paths keeps the component's FULL path list
            # registered, so this record can never shrink the
            # overlay set and drop live data on the next Publish.
            # Guarded files: a crashed validator may not have written
            # validation.json — an unguarded writer call would fail
            # on the missing file and the record would never land
            # (seen 2026-10-02..05: 5 runs, 0 records).
            files=""
            [ -f nepse-chart/data/jobs.json ] && files="$files --file nepse-chart/data/jobs.json:nepse-chart/data/jobs.json"
            [ -f nepse-chart/data/validation.json ] && files="$files --file nepse-chart/data/validation.json:nepse-chart/data/validation.json"
            if [ -z "$files" ]; then
              echo "nothing new to record — no jobs/validation file written"
            else
              # shellcheck disable=SC2086
              python3 tools/content-data-writer.py \
                --asof "$(TZ=Asia/Kathmandu date +%F)" \
                --message "content: validation FAILED (deploy blocked)" \
                --manifest-paths "nepse-chart/data/announcements.json,nepse-chart/data/corporate-actions.json,nepse-chart/data/jobs.json,nepse-chart/data/validation.json,nepse-actions/index.html,sitemap.xml" \
                $files
            fi
          else
            echo "dry-run: data-branch write skipped — nothing reaches the data branch"
          fi
          {
            echo "## Content: VALIDATION FAILED (deploy blocked)"
            echo ""
            echo "- Failed gates:"
            node -e "
              const v = require('./nepse-chart/data/validation.json');
              for (const g of v.gates.filter(g => !g.pass)) console.log('  - ' + g.gate + ': ' + g.detail);
            "
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Email alert — content validation failed
        if: failure() && steps.validate.outputs.valid == 'false'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] content: validation failed, deploy blocked"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The NEPSE content pipeline validation FAILED. The deploy was blocked;
            only the failure record was committed. Failed gates are in the job summary.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Status page: https://shirjankhadka.com.np/status/

      - name: Stage content refresh to data branch
        if: steps.validate.outputs.valid == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/record-job.js content success "announcements/actions refreshed"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry-run: data-branch write skipped — nothing reaches the data branch"
            echo "## Content: DRY-RUN — refresh validated, data-branch write skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Exactly the component's own outputs — never news.json
          # (news-refresh owns it; the writer refuses that path),
          # never data/manifest.json (it describes the whole main
          # checkout, not the data branch). The writer reports
          # WRITTEN with a commit SHA, or NO-CHANGES when content
          # is genuinely unchanged; Publish deploys the staged
          # commit (dispatched, not auto-triggered: commits made
          # with GITHUB_TOKEN do not re-trigger workflows).
          python3 tools/content-data-writer.py \
            --asof "$(TZ=Asia/Kathmandu date +%F)" \
            --message "content: announcements/actions refresh (validated)" \
            --file nepse-chart/data/announcements.json:nepse-chart/data/announcements.json \
            --file nepse-chart/data/corporate-actions.json:nepse-chart/data/corporate-actions.json \
            --file nepse-chart/data/jobs.json:nepse-chart/data/jobs.json \
            --file nepse-chart/data/validation.json:nepse-chart/data/validation.json \
            --file nepse-actions/index.html:nepse-actions/index.html \
            --file sitemap.xml:sitemap.xml
          echo "## Content: refreshed OK (see writer proof above: WRITTEN or NO-CHANGES)" >> "$GITHUB_STEP_SUMMARY"

      - name: Email alert — job failed
        if: failure() && steps.validate.outputs.valid != 'false'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[NEPSE ALERT] content: job failed (not a validation failure)"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            The NEPSE content pipeline job FAILED outside validation
            (fetch/build error, push conflict, or infrastructure).

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Status page: https://shirjankhadka.com.np/status/
