<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart load diagnostic</title>
</head>
<body>
<h1>Chart load diagnostic</h1>
<div id="diag" style="font-family:monospace;white-space:pre-wrap">starting…</div>
<script>
(function () {
  var el = document.getElementById('diag');
  function log(m) { el.textContent += '\n[' + new Date().toISOString().slice(11, 19) + '] ' + m; }
  log('inline script running; document.readyState=' + document.readyState);
  function loadScript(src, label) {
    return new Promise(function (resolve, reject) {
      var done = false;
      log(label + ': creating script tag for ' + src);
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = function () { if (!done) { done = true; log(label + ': ONLOAD'); resolve(); } };
      s.onerror = function () { if (!done) { done = true; log(label + ': ONERROR'); reject(new Error('failed ' + src)); } };
      try {
        document.head.appendChild(s);
        log(label + ': appended to head');
      } catch (e) { log(label + ': appendChild THREW: ' + e.message); reject(e); return; }
      setTimeout(function () {
        if (!done) { done = true; log(label + ': TIMEOUT 12s'); reject(new Error('timeout ' + src)); }
      }, 12000);
    });
  }
  function run() {
    log('boot: starting Promise.all');
    Promise.all([
      loadScript('/js/vendor/lightweight-charts.standalone.production.js', 'vendor'),
      loadScript('/js/nepse-daily.js?v=51f68f5d', 'daily')
    ]).then(function () {
      log('Promise.all RESOLVED');
      log('window.LightweightCharts=' + !!window.LightweightCharts);
      log('window.NEPSE_DAILY length=' + ((window.NEPSE_DAILY || []).length));
      log('DONE: all good');
    }).catch(function (e) {
      log('Promise.all REJECTED: ' + (e && e.message));
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { log('DOMContentLoaded'); run(); });
  } else { run(); }
  setTimeout(function () { log('30s watchdog: still alive'); }, 30000);
})();
</script>
</body>
</html>
