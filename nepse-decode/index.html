<!DOCTYPE html>
<html lang="en">
<head>
<script>try{var t=localStorage.getItem('sk-theme');if(!t)t='light';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF7F0">
<title>Nepse Decode – Free Stock Analysis Tools for Every NEPSE Investor</title>
<meta name="description" content="Nepse Decode: NEPSE market wrap, candlestick charts, transparent signal engine, market screener. Free, no login.">
<link rel="canonical" href="https://shirjankhadka.com.np/nepse-decode/">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/nepse-d2.css?v=20261008i">
<style>
/* Editorial overview */
:root { --ed-bg: #FAF7F0; --ed-ink: #1a1a1a; --ed-muted: #6b6b6b; --ed-line: #e8e0d0; --ed-card: #ffffff; --ed-green: #5a7d2a; --ed-red: #c0392b; }
html[data-theme="dark"] { --ed-bg: #0f1115; --ed-ink: #e8e6e1; --ed-muted: #9a978e; --ed-line: #2a2d33; --ed-card: #1a1d23; }
body { background: var(--ed-bg) !important; color: var(--ed-ink); font-family: 'Inter', sans-serif; }
.ed-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
.ed-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--ed-card); border: 1px solid var(--ed-line); border-radius: 999px; padding: 8px 16px; font-size: 13px; color: var(--ed-muted); margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.ed-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
.ed-sectors { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 16px; scrollbar-width: none; margin-bottom: 28px; }
.ed-sectors::-webkit-scrollbar { display: none; }
.ed-sector { flex: 0 0 auto; background: var(--ed-card); border: 1px solid var(--ed-line); border-radius: 12px; padding: 14px 18px; min-width: 140px; box-shadow: 0 2px 8px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04); }
.ed-sector .s-name { font-size: 12px; color: var(--ed-muted); font-weight: 500; margin-bottom: 4px; }
.ed-sector .s-val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ed-sector .s-chg { font-size: 13px; font-weight: 600; margin-top: 2px; }
.ed-sector .s-chg.down { color: var(--ed-red); }
.ed-sector .s-chg.up { color: var(--ed-green); }
.ed-nav-arrow { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; background: var(--ed-card); border: 1px solid var(--ed-line); display: flex; align-items: center; justify-content: center; cursor: pointer; align-self: center; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
.ed-grid { display: grid; gap: 32px; }
@media (min-width: 960px) { .ed-grid { grid-template-columns: 1fr 380px; } }
.ed-tags { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.ed-tag { font-size: 11px; font-weight: 700; letter-spacing: .12em; padding: 8px 14px; border-radius: 8px; border: 1.5px solid; }
.ed-tag.wrap { color: var(--ed-green); border-color: var(--ed-green); background: transparent; }
.ed-tag.date { color: var(--ed-muted); border-color: var(--ed-line); background: var(--ed-card); }
.ed-tag.close { color: #b7791f; border-color: #e8c872; background: #fef9e7; }
html[data-theme="dark"] .ed-tag.close { background: #2a2410; }
.ed-headline { font-family: 'Newsreader', Georgia, serif; font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 700; line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 20px; }
.ed-headline .red { color: var(--ed-red); }
.ed-body { font-size: 17px; line-height: 1.65; color: var(--ed-ink); margin-bottom: 16px; }
.ed-body b { font-weight: 700; }
.ed-byline { font-size: 13px; color: var(--ed-muted); margin: 20px 0; }
.ed-byline b { color: var(--ed-ink); }
.ed-cta { display: inline-flex; align-items: center; gap: 8px; background: var(--ed-green); color: #fff; font-weight: 600; font-size: 15px; padding: 14px 24px; border-radius: 12px; text-decoration: none; box-shadow: 0 4px 12px rgba(90,125,42,.3); transition: transform .15s, box-shadow .15s; }
.ed-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(90,125,42,.4); }
.ed-side-card { background: var(--ed-card); border: 1px solid var(--ed-line); border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,.08), 0 8px 32px rgba(0,0,0,.06); }
.ed-side-card .idx-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--ed-muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ed-side-card .idx-val { font-size: 42px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.ed-side-card .idx-chg { font-size: 15px; color: var(--ed-red); font-weight: 600; margin: 4px 0 16px; }
.ed-tf { display: flex; gap: 8px; margin: 16px 0; }
.ed-tf button { border: 1px solid var(--ed-line); background: var(--ed-card); color: var(--ed-muted); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.ed-tf button.active { background: var(--ed-green); color: #fff; border-color: var(--ed-green); box-shadow: 0 2px 8px rgba(90,125,42,.3); }
.ed-search { display: flex; gap: 10px; margin: 16px 0; }
.ed-search input { flex: 1; border: 1px solid var(--ed-line); background: var(--ed-bg); border-radius: 999px; padding: 12px 18px; font-size: 14px; color: var(--ed-ink); }
.ed-search button { background: var(--ed-green); color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 600; cursor: pointer; }
.ed-note { display: flex; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--ed-line); font-size: 13px; color: var(--ed-muted); line-height: 1.5; }
.ed-note .pill { flex: 0 0 auto; font-size: 10px; font-weight: 700; letter-spacing: .1em; color: #b7791f; border: 1.5px solid #e8c872; border-radius: 8px; padding: 6px 10px; height: fit-content; }
</style>
<link rel="stylesheet" href="/css/nd-chrome.css">
</head>
<body>
<div id="nd-header"></div>

<div class="ed-wrap">
  <div class="ed-badge"><span class="dot"></span> <span id="ed-asof">Data as of — · Session closed</span></div>

  <div class="ed-sectors" id="ed-sectors">
    <div class="ed-nav-arrow" onclick="document.getElementById('ed-sectors').scrollBy({left:-300})">‹</div>
    <!-- sectors injected by JS -->
    <div class="ed-nav-arrow" onclick="document.getElementById('ed-sectors').scrollBy({left:300})">›</div>
  </div>

  <div class="ed-grid">
    <div>
      <div class="ed-tags">
        <span class="ed-tag wrap">MARKET WRAP</span>
        <span class="ed-tag date" id="ed-date">—</span>
        <span class="ed-tag close" id="ed-close-tag">—</span>
      </div>
      <h1 class="ed-headline" id="ed-headline">Loading market wrap…</h1>
      <div id="ed-article"></div>
      <div class="ed-byline"><b>Nepse Decode Desk</b> · <span id="ed-byline-date">—</span> · Source: NEPSE</div>
      <a class="ed-cta" href="/nepse-chart/">See today's market →</a>
    </div>
    <div>
      <div class="ed-side-card">
        <div class="idx-label"><span>NEPSE INDEX</span><span class="ed-tag close" style="font-size:10px;padding:4px 10px">CLOSED</span></div>
        <div class="idx-val" id="ed-index-val">—</div>
        <div class="idx-chg" id="ed-index-chg">—</div>
        <canvas id="ed-chart" style="width:100%;height:180px"></canvas>
        <div class="ed-tf">
          <button class="active" data-tf="1D">1D</button>
          <button data-tf="1W">1W</button>
          <button data-tf="1M">1M</button>
          <button data-tf="3M">3M</button>
          <button data-tf="1Y">1Y</button>
        </div>
        <div class="ed-search">
          <input id="ed-search" placeholder="Search any symbol, e.g. NABIL" onkeydown="if(event.key==='Enter')edGo()">
          <button onclick="edGo()">Search</button>
        </div>
        <div class="ed-note">
          <span class="pill">CLOSING<br>FIGURES</span>
          <span>Quotes are delayed during trading hours; figures shown are the last close when the market is shut.</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function edGo(){var v=document.getElementById('ed-search').value.trim().toUpperCase();if(v)location.href='/stocks/'+v+'/';}
// Load market data from live.json and render editorial
fetch('/nepse-chart/data/live.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  var idx=d.index||{};
  var asof=d.session_date||d.asof||'—';
  document.getElementById('ed-asof').textContent='Data as of '+asof+' · Session closed';
  var dt=new Date(asof);
  var days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('ed-date').textContent=days[dt.getDay()]+', '+dt.getDate()+' '+months[dt.getMonth()]+' '+dt.getFullYear();
  var chg=idx.change||0, pct=idx.change_pct||0;
  var dir=chg>=0?'higher':'lower';
  var dirWord=chg>=0?'gains':'drags';
  document.getElementById('ed-close-tag').textContent=(chg>=0?'▲ GREEN CLOSE':'▼ RED CLOSE');
  document.getElementById('ed-headline').innerHTML='NEPSE closes <span class="red">'+dir+'</span> at '+idx.close+' as market '+dirWord;
  document.getElementById('ed-article').innerHTML='<p class="ed-body">The NEPSE index closed at <b>'+idx.close+'</b> ('+chg+' points, '+pct+'%). Market breadth and sector performance data from the latest session.</p>';
  document.getElementById('ed-byline-date').textContent='Data as of '+asof;
  document.getElementById('ed-index-val').textContent=idx.close||'—';
  document.getElementById('ed-index-chg').textContent=(chg>=0?'▲ ':'▼ ')+Math.abs(chg)+' ('+pct+'%) · '+asof;
  var sc=document.getElementById('ed-sectors');
  (d.indices||[]).slice(0,7).forEach(s=>{
    var div=document.createElement('div');div.className='ed-sector';
    var c=s.change||0, cp=s.change_pct||'0%';
    div.innerHTML='<div class="s-name">'+s.name+'</div><div class="s-val">'+s.close+'</div><div class="s-chg '+(c>=0?'up':'down')+'">'+(c>=0?'▲ +':'▼ ')+cp+'</div>';
    sc.insertBefore(div,sc.lastElementChild);
  });
}).catch(e=>{document.getElementById('ed-headline').textContent='Market data unavailable';});
</script>
<script src="/js/nd-chrome.js" defer></script>
</body>
</html>
